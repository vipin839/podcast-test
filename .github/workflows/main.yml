name: Generate Podcast Feeds
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - names: Checkout Repo
        user: actions/checkout@v3
      - name: Setup Python
        user: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run:  |
          python -m pip install --upgrade pip
          pip insatll pyyaml
      - name: Run Feed Generator
        run: python feed.py
      - name: Push Repo
        run: |
          git config user.name vipin-github-actions
          git config user.email sainivipin839@gmail.com
          git add .
          git commit -m "Modified Feed"
          git push
          
       
