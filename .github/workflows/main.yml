name: Generate Podcast Feeds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Generate podcast feed
        run: python feed.py

      - name: Create feed update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update generated podcast feed
          title: Update generated podcast feed
          body: Automatically generated from feed.yaml by GitHub Actions.
          branch: automated/feed-update
          delete-branch: true